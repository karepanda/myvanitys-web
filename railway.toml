[build]
# Serve through the nginx image defined in the Dockerfile so the security
# headers and staged CSP in nginx.conf.template actually apply in production.
builder = "DOCKERFILE"

[deploy]
# Configuration for restarts
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# We configure health checks
healthcheckPath = "/"
healthcheckTimeout = 10
healthcheckInterval = 30

# Important environment variables
[variables]
NODE_ENV = "production"
