name: Security Scans

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.1.0 (pinned full SHA)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Determine scan range
        id: range
        run: |
          log_opts=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            log_opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [[ "$before" != "0000000000000000000000000000000000000000" ]]; then
              log_opts="${before}..${after}"
            fi
          fi
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"
      - name: Run Gitleaks
        env:
          # gitleaks v8.30.1 (pinned by digest) - scan explicit ranges so side-branch
          # merge commits are included, unlike gitleaks-action's --no-merges --first-parent.
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          opts="${{ steps.range.outputs.log_opts }}"
          if [[ -n "$opts" ]]; then
            docker run --rm -v "$PWD:/src" -w /src "$GITLEAKS_IMAGE" detect --source /src --config /src/.gitleaks.toml --gitleaks-ignore-path /src/.gitleaksignore --log-opts "$opts" --redact
          else
            docker run --rm -v "$PWD:/src" -w /src "$GITLEAKS_IMAGE" detect --source /src --config /src/.gitleaks.toml --gitleaks-ignore-path /src/.gitleaksignore --redact
          fi

  npm-audit:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.1.0 (pinned full SHA)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node
        # actions/setup-node v6.5.0 (pinned full SHA)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate
